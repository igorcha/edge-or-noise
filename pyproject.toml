[project]
name = "backtester-engine"
version = "0.1.0"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=3.0",
    "pyarrow>=20",
    "pydantic>=2",
    "numba>=0.61",
    "openai>=1.50",  # Nemotron on Nebius Token Factory (OpenAI-compatible API)
    "anthropic>=0.70",  # Claude, the swappable alternative (LLM_PROVIDER=anthropic)
]

[project.optional-dependencies]
fetch = ["dukascopy-python>=4.0", "requests"]
dev = ["pytest>=8", "pytest-django>=4.9"]
api = ["django>=5.1", "djangorestframework>=3.15", "psycopg[binary]>=3.2", "gunicorn>=23", "whitenoise>=6.8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.pytest.ini_options]
testpaths = ["engine/tests", "api/backtests/tests"]
pythonpath = [".", "api"]
DJANGO_SETTINGS_MODULE = "config.settings"
markers = ["network: calls the live LLM; opt in with `pytest -m network` (needs NEBIUS_API_KEY)"]
addopts = "-m 'not network'"
